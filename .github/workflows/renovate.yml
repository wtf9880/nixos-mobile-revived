name: Renovate trigger
on:
  workflow_dispatch:
    inputs:
      debug:
        description: Enable Renovate debug logging
        required: false
        type: boolean
        default: false
jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: "renovatebot/github-action@acdd6bda8b035c99ce59d5675816af2aa65a1774" # v46.3.13
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          LOG_LEVEL: ${{ inputs.debug && 'debug' || 'info' }}
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
