name: CI
on:
  push:
    branches: [ "development" ]
  pull_request:
    branches: [ "**" ]

jobs:
  Parse_nix:
    runs-on: [ubuntu-latest]
    steps:
      - uses: "actions/checkout@5a4ac9002d0be2fb38bd78e4b4dbde5606d7042f"
      - uses: "cachix/install-nix-action@07da2520eebede906fbeefa9dd0a2b635323909d"
      - name: "Parse .nix files"
        run: .ci/parse-all.sh
  Quick_Eval:
    runs-on: [ubuntu-latest]
    steps:
      - uses: "actions/checkout@5a4ac9002d0be2fb38bd78e4b4dbde5606d7042f"
      - uses: "cachix/install-nix-action@07da2520eebede906fbeefa9dd0a2b635323909d"
      - name: "Quick Evaluation"
        run: .ci/quick-eval.sh
  # Temporarily disabled.
  #Instantiation:
  #  runs-on: [ubuntu-latest]
  #  steps:
  #    - uses: "actions/checkout@5a4ac9002d0be2fb38bd78e4b4dbde5606d7042f"
  #    - uses: "cachix/install-nix-action@07da2520eebede906fbeefa9dd0a2b635323909d"
  #    - name: "Instantiation"
  #      run: bin/hydra-eval
  Kernel_configuration_up-to-date:
    runs-on: [ubuntu-latest]
    steps:
      - uses: "actions/checkout@5a4ac9002d0be2fb38bd78e4b4dbde5606d7042f"
      - uses: "cachix/install-nix-action@07da2520eebede906fbeefa9dd0a2b635323909d"
      - name: "Kernel configuration up-to-date"
        run: |
          export NIX_PATH="nixpkgs=$(nix-instantiate --eval --raw -E 'with import ./pkgs.nix { }; path')"
          bin/kernel-normalize-all --only-check
